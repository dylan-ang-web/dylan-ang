  .dots { position:absolute; left:50%; bottom:1.2cqw; transform:translateX(-50%); display:flex; gap:calc(var(--d)*.85); padding:2.2cqw 3cqw; }

  const grid = document.getElementById(&quot;grid&quot;), msg = document.getElementById(&quot;msg&quot;);
  let timers = [];

  const h = (tag, cls, text) =&gt; { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const money = n =&gt; &quot;$&quot; + (Number.isInteger(n) ? n : n.toFixed(2));
  const getStatus = L =&gt; L.sold ? &quot;sold&quot; : L.upcoming ? &quot;upcoming&quot; : &quot;available&quot;;
  const fmtDate = d =&gt; { const [y, m, day] = String(d).split(&quot;-&quot;).map(Number);
    return y ? new Date(y, m - 1, day).toLocaleDateString(undefined, { month: &quot;short&quot;, day: &quot;numeric&quot; }) : &quot;&quot;; };
  const num = v =&gt; parseFloat(String(v).replace(/[^0-9.]/g, &quot;&quot;));

  function priceTag(L) {
    const normal = num(L.price), sale = num(L.discountedPrice);
    if (isNaN(normal) || normal &lt;= 0) return null;
    const t = h(&quot;div&quot;, &quot;price-tag&quot;);
    if (!isNaN(sale) &amp;&amp; sale &gt; 0 &amp;&amp; sale &lt; normal) {
      const sub = h(&quot;div&quot;, &quot;pt-sub&quot;);
      sub.append(h(&quot;span&quot;, &quot;pt-old&quot;, money(normal)), h(&quot;span&quot;, &quot;&quot;, Math.round((1 - sale / normal) * 100) + &quot;% off&quot;));
      t.append(h(&quot;div&quot;, &quot;pt-now&quot;, money(sale)), sub);
    } else t.append(h(&quot;div&quot;, &quot;pt-now&quot;, money(normal)));
    return t;
  }

  function card(L) {
    const imgs = (L.images || []).filter(i =&gt; i.url &amp;&amp; i.url.trim());
    const wrap = h(&quot;div&quot;, &quot;card&quot; + (L.sold ? &quot; sold&quot; : &quot;&quot;) + (L.upcoming &amp;&amp; !L.sold ? &quot; upcoming&quot; : &quot;&quot;));
    const sl = h(&quot;div&quot;, &quot;slider&quot;); wrap.append(sl);
    const slides = [], dots = []; let cur = 0, t;

    imgs.forEach((it, i) =&gt; {
      const s = h(&quot;div&quot;, &quot;slide&quot; + (i ? &quot;&quot; : &quot; active&quot;)), im = h(&quot;img&quot;);
      im.src = it.url; im.alt = it.name || &quot;Image &quot; + (i + 1); im.loading = &quot;lazy&quot;;
      s.append(im); if (it.name) s.append(h(&quot;div&quot;, &quot;caption&quot;, it.name));
      sl.append(s); slides.push(s);
    });
    const go = n =&gt; {
      slides[cur].classList.remove(&quot;active&quot;); dots[cur] &amp;&amp; dots[cur].classList.remove(&quot;active&quot;);
      cur = (n + imgs.length) % imgs.length;
      slides[cur].classList.add(&quot;active&quot;); dots[cur] &amp;&amp; dots[cur].classList.add(&quot;active&quot;);
    };
    const start = () =&gt; { clearInterval(t); t = setInterval(() =&gt; go(cur + 1), SETTINGS.slideTime); timers.push(t); };
    if (imgs.length &gt; 1) {
      const d = h(&quot;div&quot;, &quot;dots&quot;);
      imgs.forEach((_, i) =&gt; {
        const b = h(&quot;button&quot;, &quot;dot&quot; + (i ? &quot;&quot; : &quot; active&quot;)); b.setAttribute(&quot;aria-label&quot;, &quot;Go to image &quot; + (i + 1));
        b.onclick = () =&gt; { go(i); start(); }; d.append(b); dots.push(b);
      });
      sl.append(d); start();
    }
    if (!L.sold) { const tag = priceTag(L); if (tag) sl.append(tag); }
    if (getStatus(L) === &quot;upcoming&quot;) {
      sl.append(h(&quot;div&quot;, &quot;up-badge&quot;, &quot;Upcoming&quot;));
      const when = fmtDate(L.availableDate);
      wrap.append(h(&quot;span&quot;, &quot;buy-btn sold-btn&quot;, when ? &quot;Available &quot; + when : &quot;Upcoming&quot;));
      return wrap;
    }
    if (L.sold) { sl.append(h(&quot;div&quot;, &quot;sold-badge&quot;, &quot;Sold&quot;)); wrap.append(h(&quot;span&quot;, &quot;buy-btn sold-btn&quot;, &quot;Sold&quot;)); return wrap; }

    const a = h(&quot;a&quot;, &quot;buy-btn&quot;); a.href = L.link || &quot;#&quot;; a.target = &quot;_blank&quot;; a.rel = &quot;noopener&quot;;
    const label = h(&quot;span&quot;); label.append(&quot;Buy on &quot;, h(&quot;span&quot;, &quot;depop-logo&quot;, &quot;depop&quot;)); a.append(label);
    wrap.append(a); return wrap;
  }

  const only = new URLSearchParams(location.search).get(&quot;id&quot;);
  const $ = id =&gt; document.getElementById(id);
  if (!SETTINGS.showControls || only) $(&quot;bar&quot;).hidden = true;
  let all = [];

  const isDeal = L =&gt; { const n = num(L.price), d = num(L.discountedPrice); return !isNaN(n) &amp;&amp; !isNaN(d) &amp;&amp; d &gt; 0 &amp;&amp; d &lt; n; };
  const eff = L =&gt; isDeal(L) ? num(L.discountedPrice) : num(L.price);          // price the buyer pays
  const off = L =&gt; isDeal(L) ? 1 - num(L.discountedPrice) / num(L.price) : 0;  // discount amount (0-1)

  function render() {
    timers.forEach(clearInterval); timers = []; grid.innerHTML = &quot;&quot;;
    const q = $(&quot;q&quot;).value.trim().toLowerCase(), lo = +$(&quot;min&quot;).value, hi = +$(&quot;max&quot;).value;
    const deal = $(&quot;deal&quot;).checked, sort = $(&quot;sort&quot;).value, stat = $(&quot;status&quot;).value;
    const priceOn = lo &gt; 0 || hi &lt; +$(&quot;max&quot;).max;     // is the price range narrowed?
    const n = (priceOn ? 1 : 0) + (deal ? 1 : 0) + (sort !== &quot;new&quot; ? 1 : 0) + (stat !== &quot;all&quot; ? 1 : 0);   // active filters
    $(&quot;fc&quot;).textContent = n; $(&quot;fc&quot;).hidden = !n; $(&quot;clear&quot;).hidden = !(n || q);

    const list = all.filter(({ id, L }) =&gt; {
      if (only &amp;&amp; id !== only) return false;
      if (L.sold &amp;&amp; !SETTINGS.showSold) return false;
      if (stat !== &quot;all&quot; &amp;&amp; getStatus(L) !== stat) return false;
      if (q &amp;&amp; !(L.images || []).some(i =&gt; (i.name || &quot;&quot;).toLowerCase().includes(q))) return false;
      const p = eff(L);
      if (priceOn &amp;&amp; (isNaN(p) || p &lt; lo || p &gt; hi)) return false;
      if (deal &amp;&amp; !isDeal(L)) return false;
      return true;
    });

    const price = (L, empty) =&gt; isNaN(eff(L)) ? empty : eff(L);
    if (sort === &quot;low&quot;) list.sort((a, b) =&gt; price(a.L, Infinity) - price(b.L, Infinity));
    if (sort === &quot;high&quot;) list.sort((a, b) =&gt; price(b.L, -Infinity) - price(a.L, -Infinity));
    if (sort === &quot;deal&quot;) list.sort((a, b) =&gt; off(b.L) - off(a.L));
    const rank = L =&gt; SETTINGS.statusOrder.indexOf(getStatus(L));
    list.sort((a, b) =&gt; rank(a.L) - rank(b.L));   // available first, then the order set in statusOrder (sorting above is kept)

    list.forEach(({ L }) =&gt; grid.append(card(L)));
    msg.textContent = list.length ? &quot;&quot; : all.length ? &quot;No listings match your filters.&quot; : SETTINGS.emptyText;
  }

  /* price slider: two handles, max follows your most expensive listing */
  const mn = $(&quot;min&quot;), mx = $(&quot;max&quot;);
  function syncRange() {
    const top = +mx.max, lo = +mn.value, hi = +mx.value;
    $(&quot;rl&quot;).textContent = &quot;$&quot; + lo + &quot; – $&quot; + hi;
    const f = $(&quot;fill&quot;);
    f.style.left = &quot;calc(12px + (100% - 24px) * &quot; + lo / top + &quot;)&quot;;
    f.style.width = &quot;calc((100% - 24px) * &quot; + (hi - lo) / top + &quot;)&quot;;
    mn.style.zIndex = lo &gt; top / 2 ? 3 : 1;   // keeps both handles grabbable when they meet
    mx.style.zIndex = 2;
  }
  function updateBounds() {
    const prices = all.map(x =&gt; eff(x.L)).filter(p =&gt; !isNaN(p));
    $(&quot;range&quot;).hidden = !prices.length;
    const top = Math.max(1, Math.ceil(Math.max(0, ...prices)));
    const wasFull = +mx.value &gt;= +mx.max;
    mn.max = mx.max = top;
    if (wasFull || +mx.value &gt; top) mx.value = top;
    if (+mn.value &gt; +mx.value) mn.value = mx.value;
    syncRange();
  }
  mn.addEventListener(&quot;input&quot;, () =&gt; { if (+mn.value &gt; +mx.value) mn.value = mx.value; syncRange(); render(); });
  mx.addEventListener(&quot;input&quot;, () =&gt; { if (+mx.value &lt; +mn.value) mx.value = mn.value; syncRange(); render(); });
  $(&quot;ft&quot;).onclick = () =&gt; {
    const open = $(&quot;panel&quot;).hidden; $(&quot;panel&quot;).hidden = !open; $(&quot;ft&quot;).setAttribute(&quot;aria-expanded&quot;, open);
  };
  $(&quot;q&quot;).addEventListener(&quot;input&quot;, render);
  $(&quot;sort&quot;).addEventListener(&quot;change&quot;, render);
  $(&quot;deal&quot;).addEventListener(&quot;change&quot;, render);
  $(&quot;status&quot;).addEventListener(&quot;change&quot;, render);
  $(&quot;clear&quot;).onclick = () =&gt; {
    $(&quot;q&quot;).value = &quot;&quot;; $(&quot;sort&quot;).value = &quot;new&quot;; $(&quot;deal&quot;).checked = false; $(&quot;status&quot;).value = &quot;all&quot;;
    mn.value = 0; mx.value = mx.max; syncRange(); render();
  };

  db.collection(&quot;listings&quot;).orderBy(&quot;createdAt&quot;, &quot;desc&quot;).onSnapshot(snap =&gt; {
    all = snap.docs.map(d =&gt; ({ id: d.id, L: d.data() }));
    updateBounds();
    render();
  }, () =&gt; { msg.textContent = &quot;Couldn&#x27;t load listings. Check your Firebase settings.&quot;; });
&lt;/script&gt;

/* Make the shop frame exactly as tall as its listings (no inner scrollbar) */
(function(){
  var f = document.getElementById('shopFrame');
  function fit(){
    try {
      var d = f.contentDocument;
      if(d && d.documentElement) f.style.height = Math.max(300, d.documentElement.scrollHeight) + 'px';
    } catch(e){}
  }
  f.addEventListener('load', function(){
    fit();
    try { new ResizeObserver(fit).observe(f.contentDocument.body); } catch(e){}
  });
  window.addEventListener('resize', fit);
})();
